      "start_line": 297,
      "end_line": 303,
      "text": "## C-13. 출력 형식은 설명보다 템플릿으로 제공한다\n- 공통성: 매우 높음\n- 규칙:\n  - 고정된 보고 형식이 필요하면 실제 Markdown 골격을 제공한다.\n  - 긴 템플릿은 `assets/`에 두고 필요할 때만 읽게 한다.\n  - 필수·선택 섹션을 구분한다."

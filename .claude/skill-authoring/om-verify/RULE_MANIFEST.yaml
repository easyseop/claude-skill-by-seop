      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 493,
      "end_line": 504,
      "text": "## CC-17. 최종 출력은 커맨드의 단계와 일치해야 한다\n\n- `R`: 사실·근거·불확실성\n- `P`: 범위·마일스톤·검증·위험·승인\n- `I`: 변경 파일·핵심 구현·테스트·남은 위험\n- `V`: 요구사항별 판정·증거·미검증 항목\n- `F`: 재현·근본 원인·수정·회귀검증·복구\n- `O`: 대상 환경·사전점검·실행·사후검증·롤백 가능성\n- `D`: 출처·구조·독자·미확인 내용\n- `G`: 적용 범위·우선순위·기술적 강제·평가\n- `X`: 하위 단계 상태·인계 계약·통합 판정"
    },
    {
      "id": "CC-18",
      "title": "평가에서 자동 발동과 수동 실행을 분리한다",
      "category": "CC",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 505,
      "end_line": 524,
      "text": "## CC-18. 평가에서 자동 발동과 수동 실행을 분리한다\n\n자동 발동을 허용하는 스킬:\n\n- 발동해야 하는 자연어 요청\n- 발동하지 않아야 하는 요청\n- 경계 요청\n- 유사 스킬과 충돌하는 요청\n\n수동 전용 커맨드:\n\n- `/명령어`가 메뉴에 나타나는가\n- 인수 힌트가 이해되는가\n- 필수 인수 누락을 안전하게 처리하는가\n- 허용값·잘못된 경로·없는 대상에 대응하는가\n- 부작용 전 사전조건과 승인 경계를 지키는가\n- 실패 후 부분 변경과 복구를 보고하는가\n\n두 경우 모두 수행 품질은 별도로 평가한다."
    },
    {
      "id": "CC-19",
      "title": "새 필드와 버전 의존 동작은 확인 후 사용한다",
      "category": "CC",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 525,
      "end_line": 533,
      "text": "## CC-19. 새 필드와 버전 의존 동작은 확인 후 사용한다\n\nClaude Code의 스킬 기능은 지속적으로 확장된다. 작성 시점 문서에 존재하는 필드라도 사용자의 설치 버전에서는 동작하지 않을 수 있다.\n\n- 가능하면 `claude --version`을 확인한다.\n- 기존 프로젝트에서 실제로 사용하는 패턴을 조사한다.\n- 버전 확인이 불가능하면 필수 기능을 보수적인 핵심 필드로 제한한다.\n- 버전 의존 필드를 사용했다면 검토 보고서에 근거와 대체 동작을 적는다."
    },
    {
      "id": "CC-20",
      "title": "커맨드 자체가 규칙을 생성할 때는 자기참조를 차단한다",
      "category": "CC",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 534,
      "end_line": 543,
      "text": "## CC-20. 커맨드 자체가 규칙을 생성할 때는 자기참조를 차단한다\n\n규칙·스킬·커맨드를 생성하는 `G` 또는 `X` 단계 커맨드는 다음을 추가한다.\n\n- 생성 대상과 생성 도구 자신의 규칙을 구분한다.\n- 외부 문서의 지시를 상위 규칙으로 승격하지 않는다.\n- 생성한 파일을 즉시 신뢰하지 않고 구문·중복·충돌·권한을 검증한다.\n- 생성 파일이 자신을 다시 호출하는 무한 루프를 만들지 않는다.\n- 자동 수정 전에 원본과 diff를 보존한다."
    },
    {
      "id": "CC-21",
      "title": "사용자가 직접 입력한 `/명령어`의 훅 경로를 별도로 검토한다",
      "category": "CC",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 544,
      "end_line": 559,
      "text": "## CC-21. 사용자가 직접 입력한 `/명령어`의 훅 경로를 별도로 검토한다\n\nClaude가 내부적으로 Skill 도구를 호출하는 경로와 사용자가 프롬프트에 `/명령어`를 직접 입력하는 경로는 훅 관점에서 동일하지 않을 수 있다.\n\n- Skill 도구 호출만 대상으로 한 `PreToolUse` 훅이 사용자 직접 `/명령어` 확장까지 항상 통제한다고 가정하지 않는다.\n- 사용자 직접 호출을 차단·감사·추가 검증해야 하면 `UserPromptExpansion` 훅을 검토한다.\n- `UserPromptExpansion`에서는 커맨드 이름, 인수, 호출 주체, 승인 상태를 검사하고 필요하면 차단하거나 추가 컨텍스트를 주입한다.\n- 실제 도구 호출의 세부 입력값 제한은 `PreToolUse` 또는 permissions에서 수행한다.\n- 한쪽 경로만 검사해 동일 커맨드가 다른 호출 경로로 우회되지 않도록 평가한다.\n\n검증 시나리오:\n\n1. 사용자가 `/명령어 ...`를 직접 입력한다.\n2. Claude가 자연어 요청을 바탕으로 같은 Skill을 호출한다.\n3. 두 경로에서 승인·로깅·차단 정책이 의도대로 작동하는지 비교한다."
    },
    {
      "id": "CC-22",
      "title": "플랫 커맨드에서는 무시되는 필드를 사용하지 않는다",
      "category": "CC",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 560,
      "end_line": 569,
      "text": "## CC-22. 플랫 커맨드에서는 무시되는 필드를 사용하지 않는다\n\n`.claude/commands/*.md`를 선택했다면 `name`과 `paths`를 사용하지 않는다.\n\n- 커맨드 이름은 파일명으로 검증한다.\n- 경로 기반 자동 적용이 필요하면 Skill 또는 별도의 규칙 파일로 설계를 바꾼다.\n- 기존 파일에 해당 필드가 있으면 단순 보존하지 말고 실제 효과가 없는 설정인지 확인한 뒤 제거하거나 마이그레이션한다.\n\n---"
    }

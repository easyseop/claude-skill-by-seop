      "start_line": 304,
      "end_line": 310,
      "text": "## C-14. 좋은 예와 나쁜 예를 함께 제공한다\n- 공통성: 높음\n- 규칙:\n  - 문장 스타일, 출력 구조, 코드 패턴, 트리거 경계가 헷갈릴 때 예시를 둔다.\n  - 예시는 실제 사용자가 쓸 법한 표현과 실제 파일·필드 형태를 반영한다.\n  - 예시를 정답 복사본으로 만들지 말고 패턴을 보여준다."
    },
    {
      "id": "C-15",
      "title": "도구 사용을 계약 형태로 정의한다",

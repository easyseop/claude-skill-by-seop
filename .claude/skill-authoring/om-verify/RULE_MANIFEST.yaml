      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 225,
      "end_line": 236,
      "text": "## C-07. 짧고 명령 가능한 문장으로 쓴다\n- 공통성: 매우 높음\n- 규칙:\n  - 한 문장에 하나의 행동만 둔다.\n  - 동작 주체와 목적어를 생략하지 않는다.\n  - 서술형 설명보다 실행형 지시를 우선한다.\n  - 긴 배경은 별도 “이유” 문단으로 분리한다.\n- 권장 종결형: `~한다`, `~하지 않는다`.\n- 예:\n  - “변경 전 대상 파일의 기존 테스트를 읽는다.”\n  - “테스트가 실패한 상태에서는 완료로 보고하지 않는다.”"
    },
    {

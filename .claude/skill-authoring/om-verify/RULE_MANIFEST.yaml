      "title": "`I` 구현·변경 커맨드",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/02_Claude_Code_슬래시커맨드_MD_차이점_전용규칙.md",
      "start_line": 636,
      "end_line": 666,
      "text": "## 7.3 `I` 구현·변경 커맨드\n\n### 기본 프로필\n\n- 부작용: 로컬 파일 쓰기\n- 호출: 수동 호출을 우선 검토\n- 컨텍스트: 현재 변경 상태와 대화가 중요하면 inline\n- 권한: 필요한 읽기·편집·테스트 명령만 최소 승인\n\n### 공통 규칙 연결\n\n- `C-03`, `C-12`, `C-15`~`C-17`\n- `D-04`~`D-10`\n- `E-02`~`E-07`\n- `V-04`~`V-08`\n\n### 필수 전용 규칙\n\n- 수정 전 현재 git 상태와 대상 파일의 기존 동작을 확인한다.\n- 요구사항 밖의 정리·리팩터링을 섞지 않는다.\n- 작은 원자 단위로 수정하고 관련 검사를 실행한다.\n- 테스트를 요구사항에 맞춰 약화하거나 삭제하지 않는다.\n- 기존 변경을 사용자의 변경으로 추정해 덮어쓰지 않는다.\n- 완료 전에 변경 파일, 테스트, 남은 위험을 보고한다.\n\n### 완료 조건\n\n- 요구사항과 변경 위치의 대응 관계가 있다.\n- 필수 테스트가 실제로 실행돼 통과했다.\n- 실행하지 못한 검사는 미검증으로 표시한다."
    },

      "title": "규칙을 ‘조건–행동–검증–실패 처리’로 쓴다",
      "category": "C",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 237,
      "end_line": 254,
      "text": "## C-08. 규칙을 ‘조건–행동–검증–실패 처리’로 쓴다\n- 공통성: 합성 권고\n- 표준 형식:\n\n```text\n[등급] <조건>이면 <주체가 행동>한다.\n검증: <관찰 가능한 판정 방법>\n실패 시: <수정·재시도·승인·중단 중 하나>\n```\n\n- 예:\n\n```text\n[필수] 코드 파일을 변경했으면 해당 모듈의 단위 테스트를 실행한다.\n검증: 명령 종료코드가 0이고 실패 테스트가 없다.\n실패 시: 원인을 수정하고 최대 2회 재실행한 뒤, 계속 실패하면 증거와 함께 중단한다.\n```"
    },
    {

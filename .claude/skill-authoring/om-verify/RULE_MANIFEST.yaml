      "start_line": 377,
      "end_line": 382,
      "text": "## P-01. 실제 사용 사례와 실패 사례에서 시작한다\n- 최소 3개의 실제 사용자 요청을 수집한다.\n- 최소 1개의 경계 사례와 1개의 “사용하면 안 되는 요청”을 포함한다.\n- 기존 에이전트가 놓친 단계, 잘못 선택한 도구, 반복 질문, 검증 누락을 기록한다.\n- 일반적인 LLM 지식으로도 충분한 내용은 스킬에 넣지 않는다."
    },

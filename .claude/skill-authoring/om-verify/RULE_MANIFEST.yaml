      "start_line": 420,
      "end_line": 425,
      "text": "## P-06. 결정적 단계와 LLM 재량 단계를 분리한다\n- 결정적 단계: 스크립트, 스키마 검사, 정규식, CI, 승인 게이트\n- LLM 단계: 탐색, 요약, 후보 생성, 의미 판단, 설명\n- 정확히 확인 가능한 일은 결정적 단계로 이동한다.\n- LLM 판단이 필요한 경우 판단 근거로 사용할 입력과 출력 형식을 정한다."
    },
    {

      "start_line": 356,
      "end_line": 361,
      "text": "## C-19. 금지 규칙에는 안전한 대안을 함께 쓴다\n- 공통성: 높음\n- 나쁜 예: “`grep`을 사용하지 않는다.”\n- 좋은 예: “대규모 저장소 검색에는 `grep`을 사용하지 않고 `rg`를 사용한다.”\n- 이유: 에이전트가 막힌 뒤 임의의 우회로를 고르는 것을 줄인다."
    },

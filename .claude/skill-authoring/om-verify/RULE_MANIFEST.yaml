      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 459,
      "end_line": 473,
      "text": "## D-02. 설명은 구현이 아니라 사용자 의도를 중심으로 쓴다\n나쁜 예:\n\n```yaml\ndescription: Python 스크립트 세 개를 실행하고 JSON을 만든다.\n```\n\n좋은 예:\n\n```yaml\ndescription: >\n  사용자가 여러 소스의 변경사항을 비교해 영향 범위와 검증 가능한 실행계획을\n  만들도록 요청할 때 사용한다. 단순 코드 설명이나 한 파일의 문법 수정에는 사용하지 않는다.\n```"
    },
    {
      "id": "D-03",
      "title": "문서 시작부에 목적·범위·완료 조건을 둔다",
      "category": "D",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 474,
      "end_line": 482,
      "text": "## D-03. 문서 시작부에 목적·범위·완료 조건을 둔다\n긴 배경 설명보다 아래를 먼저 노출한다.\n\n1. 이 문서가 해결하는 문제\n2. 언제 적용하는가\n3. 무엇이 완료 상태인가\n4. 가장 중요한 금지·승인 조건\n5. 핵심 절차"
    },
    {
      "id": "D-04",
      "title": "순차 절차와 비순차 지침의 표기를 구분한다",
      "category": "D",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 483,
      "end_line": 489,
      "text": "## D-04. 순차 절차와 비순차 지침의 표기를 구분한다\n- 반드시 순서대로 수행: 번호 목록\n- 독립적인 원칙: 글머리표\n- 진행상태를 갱신할 장기 작업: 체크박스\n- 정적 비교: 표\n- 핵심 절차를 지나치게 큰 표에 넣지 않는다."
    },
    {
      "id": "D-05",
      "title": "각 단계에 입출력과 검증을 붙인다",

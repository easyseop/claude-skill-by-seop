      "start_line": 193,
      "end_line": 203,
      "text": "## C-04. 핵심 문서는 독립적으로 이해 가능하게 만든다\n- 공통성: 높음\n- 규칙: 독자가 이전 대화나 작성자의 기억 없이도 목적·범위·진행 방법을 이해할 수 있어야 한다.\n- 필요한 항목:\n  - 저장소 기준 경로\n  - 필요한 전제조건\n  - 입력 출처\n  - 정확한 명령어\n  - 예상 산출물\n  - 완료 판정"
    },
    {

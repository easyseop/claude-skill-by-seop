      "start_line": 180,
      "end_line": 186,
      "text": "## C-02. 적용 조건과 비적용 조건을 함께 쓴다\n- 공통성: 매우 높음\n- 규칙: “무엇을 하는가”뿐 아니라 “어떤 요청에서 사용하며 어떤 요청에서는 사용하지 않는가”를 적는다.\n- 좋은 예:\n  - “사용자가 여러 파일의 API 변경 영향을 분석하고 수정 계획을 요구할 때 사용한다.”\n  - “단순 문법 질문이나 한 줄 수정에는 사용하지 않는다.”"
    },
    {
      "id": "C-03",
      "title": "완료 조건을 산출물과 검증 가능 상태로 정의한다",

      "start_line": 266,
      "end_line": 273,
      "text": "## C-10. 선택지 나열보다 기본 경로를 정한다\n- 공통성: 높음\n- 규칙:\n  - 기본 도구·방법을 하나 정한다.\n  - 대안은 기본 방법이 실패하거나 특정 조건이 성립할 때만 제시한다.\n- 예:\n  - “텍스트 PDF는 `pdfplumber`를 기본으로 사용한다. 스캔 문서로 확인된 경우에만 OCR 경로를 사용한다.”"
    },

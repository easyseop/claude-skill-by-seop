      "start_line": 362,
      "end_line": 372,
      "text": "## C-20. 규칙 변경은 실제 실패와 평가 결과에 근거한다\n- 공통성: 매우 높음\n- 규칙:\n  - 반복된 오작동을 일반화해 추가한다.\n  - 한 번의 특이 사례를 지나치게 넓은 금지로 만들지 않는다.\n  - 기존 규칙과 충돌하는지 검사한다.\n  - 변경 전 버전 또는 스킬 미사용 상태와 비교 평가한다.\n  - 개선 효과가 없거나 토큰·시간 비용만 늘면 되돌린다.\n\n---"
    },
    {

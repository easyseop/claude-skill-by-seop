      "start_line": 255,
      "end_line": 265,
      "text": "## C-09. 작업의 취약성에 맞춰 지시 강도를 조절한다\n- 공통성: 매우 높음\n- 규칙:\n  - 여러 접근이 모두 유효하면 목표와 이유를 설명하고 재량을 준다.\n  - 마이그레이션, 배포, 삭제, 보안처럼 순서가 중요하면 정확한 명령·순서를 고정한다.\n  - 한 문서 안에서도 단계별로 강도를 다르게 한다.\n- 나쁜 예: 모든 문장에 “절대”, “반드시”를 붙인다.\n- 좋은 예:\n  - 탐색 단계: “가장 관련성이 높은 파일부터 조사한다.”\n  - 배포 단계: “아래 명령을 순서와 옵션을 변경하지 않고 실행한다.”"
    },
    {

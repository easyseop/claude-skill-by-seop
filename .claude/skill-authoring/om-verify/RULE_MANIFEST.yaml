      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 311,
      "end_line": 322,
      "text": "## C-15. 도구 사용을 계약 형태로 정의한다\n- 공통성: 매우 높음\n- 각 도구에 아래를 적는다.\n  - 언제 사용하는가\n  - 언제 사용하지 않는가\n  - 필수 입력은 무엇인가\n  - 성공 출력은 무엇인가\n  - 오류 출력은 어떻게 해석하는가\n  - 부작용은 무엇인가\n  - 승인이나 권한이 필요한가\n- 도구 이름은 의미가 드러나게 짓고, 비슷한 기능을 지나치게 잘게 나누지 않는다."
    },

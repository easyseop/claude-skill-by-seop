      "start_line": 383,
      "end_line": 390,
      "text": "## P-02. 해결할 문제를 한 문장으로 고정한다\n권장 형식:\n\n```text\n이 문서는 <사용자 유형>이 <상황>에서 <산출물>을 얻도록 돕되,\n<주요 위험·제약>을 지키는 절차를 정의한다.\n```"
    },

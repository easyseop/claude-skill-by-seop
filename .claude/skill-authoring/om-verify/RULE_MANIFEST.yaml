      "start_line": 438,
      "end_line": 448,
      "text": "## P-08. 평가 계획을 문서 작성 전에 만든다\n- 발동해야 하는 프롬프트\n- 발동하지 않아야 하는 프롬프트\n- 정상·모호·경계·오류·공격성 입력\n- 객관적 단언문\n- 사람 검토 항목\n- 비교 기준\n- 시간·토큰·도구 호출 비용\n\n---"
    },
    {

      "start_line": 170,
      "end_line": 179,
      "text": "## C-01. 한 문서에는 하나의 주된 책임만 둔다\n- 공통성: 매우 높음\n- 규칙: 하나의 스킬이 서로 다른 두 도메인이나 서로 다른 생명주기의 작업을 동시에 담당하지 않게 한다.\n- 판정 질문: “이 문서의 목적을 한 문장으로 말할 수 있는가?”\n- 분리 신호:\n  - 트리거가 서로 다르다.\n  - 입력과 출력 형식이 다르다.\n  - 필요한 도구 권한이 다르다.\n  - 한 부분은 항상 필요하고 다른 부분은 가끔 필요하다."
    },
    {

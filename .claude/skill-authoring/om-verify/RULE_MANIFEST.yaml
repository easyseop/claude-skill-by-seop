      "start_line": 410,
      "end_line": 419,
      "text": "## P-05. 완료 계약을 먼저 작성한다\n최소 항목:\n\n- 최종 산출물\n- 저장 위치 또는 전달 형식\n- 필수 내용\n- 테스트·검사\n- 허용 가능한 미해결 사항\n- 완료로 보고하면 안 되는 조건"
    },
    {

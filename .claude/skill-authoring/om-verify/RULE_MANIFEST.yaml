      "title": "위험과 권한을 설계한다",
      "category": "P",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 426,
      "end_line": 437,
      "text": "## P-07. 위험과 권한을 설계한다\n위험 분류 예:\n\n| 위험 | 기본 처리 |\n|---|---|\n| 읽기 전용 조사 | 자동 진행 가능 |\n| 저장소 내부 수정 | 범위 제한 후 진행 |\n| 대량 수정 | 계획과 미리보기 후 진행 |\n| 파일 삭제·데이터 변경 | 명시적 승인과 롤백 필요 |\n| 외부 전송·배포·결제 | 사람 승인 필수 |\n| 비밀정보 접근 | 최소권한·마스킹·감사로그 필요 |"
    },

      "start_line": 187,
      "end_line": 192,
      "text": "## C-03. 완료 조건을 산출물과 검증 가능 상태로 정의한다\n- 공통성: 매우 높음\n- 규칙: 목표를 추상적 품질이 아니라 관찰 가능한 결과로 쓴다.\n- 나쁜 예: “안정적인 코드를 작성한다.”\n- 좋은 예: “변경 파일, 실행한 테스트, 테스트 결과, 남은 위험을 보고하고 필수 테스트가 모두 통과하면 완료로 판정한다.”"
    },
    {
      "id": "C-04",
      "title": "핵심 문서는 독립적으로 이해 가능하게 만든다",

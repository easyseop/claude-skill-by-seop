      "start_line": 204,
      "end_line": 211,
      "text": "## C-05. 규칙의 우선순위와 적용 범위를 명시한다\n- 공통성: 매우 높음\n- 규칙: 전역·프로젝트·경로·스킬·사용자 요청 간 충돌 처리 방식을 정한다.\n- 권장 문장:\n  - “보안 및 승인 규칙은 아래 작업 절차보다 우선한다.”\n  - “이 규칙은 `src/api/**`에만 적용한다.”\n  - “하위 경로 규칙이 더 구체적인 경우 하위 규칙을 따른다.”"
    },
    {
      "id": "C-06",
      "title": "핵심은 짧게, 상세자료는 점진적으로 공개한다",
      "category": "C",
      "source_file": "/Users/seop/claude-skill-by-seop/.claude/skills/claude-skill-author/references/01_LLM_스킬_하네스_MD_공통_작성규칙.md",
      "start_line": 212,
      "end_line": 224,
      "text": "## C-06. 핵심은 짧게, 상세자료는 점진적으로 공개한다\n- 공통성: 매우 높음\n- 규칙:\n  - 항상 읽히는 파일에는 핵심 절차와 치명적 함정만 둔다.\n  - 긴 도메인 문서·변형별 지침은 `references/`로 분리한다.\n  - 반복 실행 로직은 `scripts/`로 분리한다.\n  - 출력용 긴 틀과 샘플은 `assets/`로 분리한다.\n  - 각 참조는 “언제 읽을지”를 본문에 쓴다.\n- 좋은 예: “API가 200 이외 상태를 반환하면 `references/api-errors.md`를 읽는다.”\n- 나쁜 예: “자세한 내용은 `references/`를 참고한다.”\n\n> 특정 제품의 권장 한도는 서로 다르다. Agent Skills와 Cursor는 핵심 파일을 약 500줄 이하로 권장하고, GitHub Copilot은 단일 파일을 약 1,000줄 이하로 권장한다. 따라서 **500줄을 범용 절대규칙으로 삼기보다, 핵심 파일이 200~500줄 또는 약 5,000토큰에 접근하면 분리를 검토**하는 편이 안전하다."
    },
    {

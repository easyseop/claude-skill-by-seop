      "start_line": 391,
      "end_line": 396,
      "text": "## P-03. 범위를 포함·제외 목록으로 나눈다\n- 포함: 문서가 직접 책임질 작업\n- 제외: 다른 문서·도구·사람이 책임질 작업\n- 경계: 조건에 따라 포함 여부가 바뀌는 작업\n- 범위가 넓으면 스킬을 나눈다."

      "start_line": 451,
      "end_line": 458,
      "text": "## D-01. 제품이 요구하는 메타데이터를 정확히 따른다\nAgent Skills 형식을 사용할 경우:\n\n- `name`은 소문자 영문·숫자·하이픈으로 작성한다.\n- 디렉터리명과 `name`을 일치시킨다.\n- `description`에는 기능과 사용 시점을 함께 쓴다.\n- 규칙 문장은 한글로 작성하되 키 이름은 번역하지 않는다."

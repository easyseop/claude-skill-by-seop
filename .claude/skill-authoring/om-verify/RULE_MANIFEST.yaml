      "start_line": 397,
      "end_line": 409,
      "text": "## P-04. 활성화 방식을 결정한다\n다음 중 하나 이상을 선택한다.\n\n- 항상 적용\n- 프로젝트 적용\n- 경로 적용\n- 사용자 의도 기반 자동 발동\n- 명시적 명령 호출\n- 모드·역할 기반\n- 이벤트 기반\n\n발동 조건과 해제 조건을 함께 설계한다."
    },

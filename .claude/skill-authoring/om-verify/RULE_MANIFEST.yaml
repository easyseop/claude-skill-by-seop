      "start_line": 281,
      "end_line": 296,
      "text": "## C-12. 경로·명령·스키마·산출물 이름을 정확히 쓴다\n- 공통성: 매우 높음\n- 규칙:\n  - 명령어는 언어가 지정된 코드 블록에 넣는다.\n  - 실행 디렉터리를 적는다.\n  - 입력·출력 파일명을 적는다.\n  - 성공 시 예상되는 핵심 출력을 적는다.\n  - 자리표시자는 `<대상_경로>`처럼 명확히 구분한다.\n- 나쁜 예: “적절한 테스트를 실행한다.”\n- 좋은 예:\n\n```bash\ncd <저장소_루트>\npytest tests/api/test_users.py -q\n```"

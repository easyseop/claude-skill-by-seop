      "start_line": 274,
      "end_line": 280,
      "text": "## C-11. 추상 원칙보다 재사용 가능한 절차를 쓴다\n- 공통성: 매우 높음\n- 규칙:\n  - 특정 한 건의 정답을 적지 않는다.\n  - 같은 종류의 문제에 반복 적용할 탐색·판단·실행 방법을 쓴다.\n  - 단계 사이의 의존성과 분기를 표시한다."

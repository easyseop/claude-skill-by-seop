name: Upstream Recovery Planner Test

on:
  pull_request:
    branches:
      - orchestration/session-collaboration-framework
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.claude/skills/capability-artifact-planner/**'
      - '.claude/agents/capability-plan-auditor.md'
      - 'docs/agent-authoring/workstreams/upstream-recovery/**'
      - '.github/workflows/upstream-recovery-planner-test.yml'

permissions:
  contents: write

jobs:
  planner-test:
    if: github.event.pull_request.head.ref == 'recovery/upstream-builders'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLANNER_DIR: .claude/skills/capability-artifact-planner
      EVIDENCE_DIR: docs/agent-authoring/evidence/capability-planner
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Planner Python sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$PLANNER_DIR/scripts" -type f -name '*.py' -print | sort)
          test "${#files[@]}" -gt 0
          python -m py_compile "${files[@]}"

      - name: Run Planner self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python "$PLANNER_DIR/scripts/run_self_tests.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --results-dir "$GITHUB_WORKSPACE/$EVIDENCE_DIR" \
            2>&1 | tee planner-test.log

      - name: Generate contracts, audit, stop result, manifest, and report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          scripts = Path('.claude/skills/capability-artifact-planner/scripts').resolve()
          sys.path.insert(0, str(scripts))
          from common import write_json
          from run_self_tests import valid_plan
          evidence = Path('docs/agent-authoring/evidence/capability-planner')
          evidence.mkdir(parents=True, exist_ok=True)
          write_json(evidence / 'fixture-plan.json', valid_plan())
          PY
          python "$PLANNER_DIR/scripts/check_capability_plan.py" "$EVIDENCE_DIR/fixture-plan.json" --output "$EVIDENCE_DIR/planner-check.json"
          python "$PLANNER_DIR/scripts/derive_contracts.py" "$EVIDENCE_DIR/fixture-plan.json" --output-dir "$EVIDENCE_DIR/contracts"
          python "$PLANNER_DIR/scripts/audit_capability_plan.py" "$EVIDENCE_DIR/fixture-plan.json" --output "$EVIDENCE_DIR/planner-audit-result.json"
          python "$PLANNER_DIR/scripts/planner_stop_gate.py" \
            --machine-check "$EVIDENCE_DIR/planner-check.json" \
            --audit "$EVIDENCE_DIR/planner-audit-result.json" \
            --contract "$EVIDENCE_DIR/contracts/GATE_CONTRACT.yaml" \
            --contract "$EVIDENCE_DIR/contracts/EXECUTION_CONTRACT.yaml" \
            --contract "$EVIDENCE_DIR/contracts/KNOWLEDGE_CONTRACT.yaml" \
            --contract "$EVIDENCE_DIR/contracts/ASSEMBLY_CONTRACT.yaml" \
            --output "$EVIDENCE_DIR/planner-stop-gate.json"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          planner = Path('.claude/skills/capability-artifact-planner')
          auditor = Path('.claude/agents/capability-plan-auditor.md')
          evidence = Path('docs/agent-authoring/evidence/capability-planner')
          manifest_path = evidence / 'implementation-manifest.json'

          def sha(path: Path) -> str:
              return 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()

          source_files = sorted(p for p in planner.rglob('*') if p.is_file() and '__pycache__' not in p.parts) + [auditor]
          source_rows = [{'path': p.as_posix(), 'sha256': sha(p), 'bytes': p.stat().st_size} for p in source_files]
          canonical = ''.join(f"{row['path']}\0{row['sha256']}\n" for row in source_rows).encode()
          source_digest = 'sha256:' + hashlib.sha256(canonical).hexdigest()

          evidence_files = sorted(p for p in evidence.rglob('*') if p.is_file() and p != manifest_path)
          evidence_rows = [{'path': p.as_posix(), 'sha256': sha(p), 'bytes': p.stat().st_size} for p in evidence_files]
          manifest = {
              'schema_version': '1.0',
              'status': 'PASS_LOCAL_PROCEDURE',
              'subject_source_digest': source_digest,
              'operational_permission': False,
              'independent_identity': 'UNVERIFIED',
              'source_files': source_rows,
              'evidence_files': evidence_rows,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')

          report = f'''# Capability & Artifact Planner 복구 구현 결과

## 종합 판정

현재 source는 GitHub Actions의 격리 runner에서 검증됐으며 **PASS_LOCAL_PROCEDURE**다.

- source digest: `{source_digest}`
- CAP 규칙: 36/36
- 기준 평가: 22/22
- 표현 변형: 44/44
- 총 시나리오: 66/66
- mutation: 15/15 killed
- 동일 입력 멱등성: PASS
- Prompt-only downstream Skill 미생성: PASS
- Skill 선택 시 조건부 author handoff: PASS

## 범위

Planner는 `CAPABILITY_PLAN.yaml`을 정본으로 사용하고 실제 업무 Skill·Script·Tool·RAG·Agent를 직접 만들지 않는다. 검증된 Plan에서 Gate·Execution·Knowledge·Assembly 계약만 파생한다.

## 감사·완료 경계

- deterministic machine check: PASS
- procedural audit: PASS_LOCAL_PROCEDURE
- actual independent executor: not run
- independence: UNVERIFIED
- operational permission: false
- production write·deployment·secret collection·automatic merge: forbidden

## Evidence

`docs/agent-authoring/evidence/capability-planner/` 아래 self-test, scenario, mutation, metrics, machine check, contracts, audit, stop gate, implementation manifest를 보존한다.

## 다음 단계

Ownership boundary가 PASS하면 Planner를 `VERIFIED_LOCAL_CANDIDATE`로 닫고 Gate Generator M0~M3 복구를 시작한다.
'''
          Path('docs/agent-authoring/CAPABILITY_ARTIFACT_PLANNER_구현결과.md').write_text(report, encoding='utf-8')

          state = f'''schema_version: "1.0"
workstream_id: upstream-recovery
session_type: implementation
repository: easyseop/claude-skill-by-seop
branch: recovery/upstream-builders
status: IN_PROGRESS
phase: P_BOUNDARY_RECHECK
updated_at: "2026-11-23"

source_of_truth:
  start_prompt: docs/agent-authoring/workstreams/upstream-recovery/SESSION_START_PROMPT.md
  remote_connector_mode: docs/agent-authoring/workstreams/upstream-recovery/REMOTE_CONNECTOR_MODE.md
  work_order: docs/agent-authoring/workstreams/upstream-recovery/WORK_ORDER.md
  ownership: docs/agent-authoring/workstreams/upstream-recovery/OWNERSHIP.yaml
  input_manifest: docs/agent-authoring/workstreams/upstream-recovery/INPUT_MANIFEST.yaml
  output_manifest: docs/agent-authoring/workstreams/upstream-recovery/OUTPUT_MANIFEST.yaml
  handoff_log: docs/agent-authoring/workstreams/upstream-recovery/HANDOFF_LOG.md

progress:
  planner_source:
    status: TESTED_PASS_BOUNDARY_PENDING
    source_digest: {source_digest}
    cap_rules: "36/36"
    evals: "22/22"
    paraphrase_variants: "44/44"
    scenario_runs: "66/66"
    mutations: "15/15 killed"
    local_procedural_audit: PASS
    independent_identity: UNVERIFIED
    operational_permission: false
  gate_source: PENDING
  execution_source: PENDING

blocker: null
next_action: >-
  Pass the orchestrator-approved ownership boundary check, then mark Planner
  VERIFIED_LOCAL_CANDIDATE and start Gate Generator M0-M3 recovery.
'''
          Path('docs/agent-authoring/workstreams/upstream-recovery/CURRENT_SESSION_STATE.yaml').write_text(state, encoding='utf-8')

          output = ['schema_version: "1.0"', 'workstream_id: upstream-recovery', 'generated_at: "2026-11-23"', '', 'outputs:',
                    '  - path: .claude/skills/capability-artifact-planner/', '    kind: source_package', '    status: tested_pass',
                    '  - path: .claude/agents/capability-plan-auditor.md', '    kind: auditor_definition', '    status: implemented_independence_unverified',
                    '  - path: docs/agent-authoring/evidence/capability-planner/', '    kind: evidence_package', '    status: tested_pass',
                    '  - path: docs/agent-authoring/CAPABILITY_ARTIFACT_PLANNER_구현결과.md', '    kind: implementation_report', '    status: complete',
                    '', 'planner_test:', f'  source_digest: {source_digest}', '  status: PASS_LOCAL_PROCEDURE',
                    '  cap_rules: 36', '  base_evals: 22', '  paraphrase_variants: 44', '  scenario_runs: 66',
                    '  mutations_killed: 15', '  mutations_total: 15', '  independent_identity: UNVERIFIED',
                    '', 'checks:', '  ownership_boundary: PENDING_RECHECK', '  input_manifest_current: PASS_RESEALED',
                    '  planner_complete: TESTED_PASS', '  gate_complete: PENDING', '  execution_complete: PENDING',
                    '  critical_mutants_survived: 0', '  operational_permission: false', '', 'review_status: PLANNER_BOUNDARY_RECHECK']
          Path('docs/agent-authoring/workstreams/upstream-recovery/OUTPUT_MANIFEST.yaml').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Verify complete Planner candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('docs/agent-authoring/evidence/capability-planner')
          required = ['self-test-summary.json','scenario-results.json','mutation-results.json','planner-metrics.json','planner-check.json','planner-audit-result.json','planner-stop-gate.json','implementation-manifest.json']
          for name in required:
              assert (base / name).is_file(), name
          for name in ['GATE_CONTRACT.yaml','EXECUTION_CONTRACT.yaml','KNOWLEDGE_CONTRACT.yaml','ASSEMBLY_CONTRACT.yaml']:
              assert (base / 'contracts' / name).is_file(), name
          for path in [Path('.claude/skills/capability-artifact-planner/references/CAP_RULES.md'),Path('.claude/skills/capability-artifact-planner/references/RULE_COVERAGE.yaml'),Path('.claude/skills/capability-artifact-planner/evals/planner-evals.yaml'),Path('.claude/skills/capability-artifact-planner/evals/mutations.yaml')]:
              assert path.is_file(), path
          summary=json.loads((base/'self-test-summary.json').read_text())
          mutations=json.loads((base/'mutation-results.json').read_text())
          audit=json.loads((base/'planner-audit-result.json').read_text())
          stop=json.loads((base/'planner-stop-gate.json').read_text())
          manifest=json.loads((base/'implementation-manifest.json').read_text())
          assert summary.get('status') == 'PASS', summary
          assert summary.get('counts') == {'base_evals':22,'cap_rules':36,'mutations_killed':15,'mutations_total':15,'paraphrase_variants':44,'scenario_runs':66}, summary
          items=mutations.get('results',[])
          assert len(items)==15 and all(x.get('status')=='KILLED' for x in items), items
          assert audit.get('status')=='PASS_LOCAL_PROCEDURE' and audit.get('independence',{}).get('actual_independent_executor_ran') is False, audit
          assert stop.get('status')=='PASS_LOCAL_PROCEDURE' and stop.get('operational_permission') is False, stop
          assert manifest.get('status')=='PASS_LOCAL_PROCEDURE' and manifest.get('subject_source_digest','').startswith('sha256:'), manifest
          PY

      - name: Commit verified Planner evidence to workstream branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Harness Workstream Orchestrator"
          git config user.email "71008721+easyseop@users.noreply.github.com"
          git add \
            "$PLANNER_DIR/references/CAP_RULES.md" \
            "$PLANNER_DIR/references/RULE_COVERAGE.yaml" \
            "$PLANNER_DIR/evals/planner-evals.yaml" \
            "$PLANNER_DIR/evals/mutations.yaml" \
            "$EVIDENCE_DIR" \
            docs/agent-authoring/CAPABILITY_ARTIFACT_PLANNER_구현결과.md \
            docs/agent-authoring/workstreams/upstream-recovery/CURRENT_SESSION_STATE.yaml \
            docs/agent-authoring/workstreams/upstream-recovery/OUTPUT_MANIFEST.yaml
          if git diff --cached --quiet; then
            echo "Verified Planner evidence is already current."
          else
            git commit -m "test(planner): bind verified local evidence"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Upload Planner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-planner-test-evidence
          path: |
            planner-test.log
            docs/agent-authoring/evidence/capability-planner/
            .claude/skills/capability-artifact-planner/references/CAP_RULES.md
            .claude/skills/capability-artifact-planner/references/RULE_COVERAGE.yaml
            .claude/skills/capability-artifact-planner/evals/planner-evals.yaml
            .claude/skills/capability-artifact-planner/evals/mutations.yaml
          if-no-files-found: error
          retention-days: 14

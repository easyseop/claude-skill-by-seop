schema_version: "1.0"
project: agent-system-author
updated_at: "2026-11-23"

capacity:
  orchestrator_sessions: 1
  research_sessions: 1
  implementation_sessions: 1
  review_sessions: 1

policies:
  auto_merge: false
  main_direct_write: false
  one_active_workstream_per_session: true
  cross_workstream_write: false
  start_downstream_before_dependency_verified: false
  research_can_run_parallel_with_unrelated_implementation: true

active_assignment_policy:
  implementation_session:
    current: upstream-recovery
    forbidden_concurrent:
      - knowledge-rag-builder-k0-k6
      - assembler-implementation
  research_session:
    current: assembler-research
    forbidden_concurrent:
      - external-discovery-research
      - independent-evaluation-research

lanes:
  implementation:
    - id: upstream-recovery
      priority: 1
      status: FINAL_HEAD_VERIFICATION_PENDING
      branch: recovery/upstream-builders
      pull_request: 4
      owner_role: implementation_session
      objective: >-
        Restore and verify Capability Planner, Gate Generator M0-M3, and
        Execution Artifact Generator E0-E4 source and structured evidence.
      progress:
        planner: TESTED_PASS_FINAL_HEAD_PENDING
        gate: TESTED_PASS_FINAL_HEAD_PENDING
        execution: TESTED_PASS_FINAL_HEAD_PENDING
      current_controls:
        writable_ci_removed: true
        verification_ci: serialized_read_only
        state_manifest_reconciled: true
        operational_permission: false
      dependencies: []
      blocks:
        - knowledge-rag-builder-k0-k6
      allowed_parallel_with:
        - assembler-research
      start_prompt: docs/agent-authoring/workstreams/upstream-recovery/SESSION_START_PROMPT.md
      next_gate: >-
        Require both the workstream boundary check and the serialized read-only
        Planner/Gate/Execution verification to pass on the exact current head,
        then perform evidence/hash review before VERIFIED_LOCAL.

    - id: knowledge-rag-builder-k0-k6
      priority: 2
      status: BLOCKED_FOR_SOURCE
      branch: codex/knowledge-rag-builder-k0-k6
      pull_request: 1
      owner_role: implementation_session
      objective: Implement Knowledge & RAG Builder K0-K6 local candidate.
      dependencies:
        - upstream-recovery: VERIFIED_LOCAL
      blocks:
        - assembler-implementation
      resume_policy: >-
        Resume only after upstream-recovery is reviewed and its current
        source/evidence are merged or digest-bound into this workstream.

    - id: assembler-implementation
      priority: 3
      status: QUEUED
      branch: implementation/agent-workflow-assembler
      owner_role: implementation_session
      dependencies:
        - knowledge-rag-builder-k0-k6: VERIFIED_LOCAL
        - assembler-research: VERIFIED_RESEARCH
      blocks:
        - independent-evaluation-implementation

    - id: independent-evaluation-implementation
      priority: 4
      status: QUEUED
      branch: implementation/independent-evaluation
      owner_role: implementation_session
      dependencies:
        - assembler-implementation: VERIFIED_LOCAL
        - independent-evaluation-research: VERIFIED_RESEARCH
      blocks:
        - top-level-integration

    - id: top-level-integration
      priority: 5
      status: QUEUED
      branch: implementation/agent-system-author-integration
      owner_role: implementation_session
      dependencies:
        - independent-evaluation-implementation: VERIFIED_LOCAL
        - external-discovery-research: VERIFIED_RESEARCH

  research:
    - id: assembler-research
      priority: 1
      status: BOUNDARY_RECHECK_PENDING
      branch: research/agent-workflow-assembler
      pull_request: 2
      owner_role: research_session
      objective: Research Agent & Workflow Assembler rules and contracts.
      input_binding:
        remote_mode_formally_approved: true
        ownership_resealed: true
        input_manifest_resealed: true
      dependencies: []
      blocks:
        - assembler-implementation
      allowed_parallel_with:
        - upstream-recovery
      start_prompt: docs/agent-authoring/workstreams/agent-workflow-assembler-research/SESSION_START_PROMPT.md
      next_gate: >-
        Require a current-head boundary PASS, then start the 25-section research
        and write only state, handoff, output manifest, and final research report.

    - id: external-discovery-research
      priority: 2
      status: QUEUED
      branch: research/external-capability-discovery
      owner_role: research_session
      objective: >-
        Research discovery and critical evaluation of reusable Skills,
        plugins, MCP servers, scripts, and packages.
      dependencies:
        - assembler-research: READY_FOR_REVIEW_OR_VERIFIED
      blocks:
        - top-level-integration

    - id: independent-evaluation-research
      priority: 3
      status: QUEUED
      branch: research/independent-evaluation
      owner_role: research_session
      dependencies:
        - assembler-research: VERIFIED_RESEARCH
      blocks:
        - independent-evaluation-implementation

review_sequence:
  - upstream-recovery
  - knowledge-rag-builder-k0-k6
  - assembler-research
  - external-discovery-research
  - assembler-implementation
  - independent-evaluation-research
  - independent-evaluation-implementation
  - top-level-integration

next_actions:
  orchestrator:
    - Monitor the exact current PR #4 head for read-only verification and boundary results.
    - Promote upstream-recovery only after current-head evidence/hash review.
    - Monitor PR #2 current-head boundary recheck; unblock research only on PASS.
    - Do not merge or prepare downstream implementation before dependencies verify.
  implementation_session:
    - Do not add new source while final-head verification is running.
    - Do not modify or resume Knowledge/RAG PR #1 yet.
  research_session:
    - Start Assembler research only after the current-head boundary PASS.
    - Do not modify implementation or evidence paths.
